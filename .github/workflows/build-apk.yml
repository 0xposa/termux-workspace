name: Build Android APK

on:
  push:
    branches: [ "main" ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Java JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Gradle 8.7
        uses: gradle/actions/setup-gradle@v3
        with:
          gradle-version: '8.7'

      - name: Build Debug and Release APK
        working-directory: android
        run: |
          gradle assembleRelease assembleDebug

      - name: Prepare APK outputs
        run: |
          mkdir -p dist
          if [ -f "android/app/build/outputs/apk/release/app-release.apk" ]; then
            cp android/app/build/outputs/apk/release/app-release.apk dist/TermuxWorkspace-v1.1.apk
          else
            cp android/app/build/outputs/apk/debug/app-debug.apk dist/TermuxWorkspace-v1.1.apk
          fi
          cp android/app/build/outputs/apk/debug/app-debug.apk dist/TermuxWorkspace-v1.1-debug.apk

      - name: Upload Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: TermuxWorkspace-v1.1-apk
          path: dist/*.apk

      - name: Attach APK to GitHub Release v1.1.0
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release upload v1.1.0 dist/*.apk --clobber || true
