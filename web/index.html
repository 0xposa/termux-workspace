<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Termux Workspace</title>
  <link rel="stylesheet" href="/vendor/xterm.css">
  <link rel="stylesheet" href="/style.css">
</head>
<body>
  <div id="layout" class="layout">
    <!-- Area Utama -->
    <div class="main-area">
      <!-- Bar Tab -->
      <div class="tab-bar">
        <div id="tabs-container" class="tabs-container"></div>
        <button id="btn-add-session" class="btn-add" title="New Session">+</button>
        <div id="editor-actions-bar" class="editor-actions-bar hidden">
          <span id="editor-status" class="editor-status">Tersimpan</span>
          <span id="editor-cursor-pos" class="editor-cursor-pos">Ln 1, Col 1</span>
          <button id="btn-save-file" class="editor-btn" title="Simpan file (Ctrl+S)">
            <img src="/icons/save.svg" width="14" height="14" class="editor-btn-icon" alt="" />
            <span class="btn-text">Simpan</span>
          </button>
          <button id="btn-send-to-terminal" class="editor-btn" title="Kirim path file ke terminal aktif">
            <img src="/icons/terminal.svg" width="14" height="14" class="editor-btn-icon" alt="" />
            <span class="btn-text">Ke Terminal</span>
          </button>
        </div>
      </div>

      <!-- Menu Popup New Session -->
      <div id="popup-menu" class="popup-menu hidden">
        <div class="popup-title">New Session</div>
        <div id="popup-items" class="popup-items">
          <div class="popup-item" data-action="terminal">Terminal</div>
          <div class="popup-item" data-action="explorer">Explorer</div>
        </div>
        <div class="popup-search-box">
          <input type="text" id="popup-search-input" placeholder="Search/shortcut..." autocomplete="off">
          <span class="shortcut-badge">Ctrl K</span>
        </div>
      </div>

      <!-- Area Terminal -->
      <div id="terminal-area" class="terminal-area hidden">
        <div id="terminal-container" class="terminal-container"></div>
      </div>

      <!-- Area Explorer Full View -->
      <div id="explorer-area" class="explorer-area">
        <div class="explorer-toolbar">
          <div class="explorer-nav-group">
            <button id="explorer-btn-up" class="explorer-tool-btn" title="Folder Induk (Naik 1 Level)">
              <img src="/icons/arrow-left.svg" width="14" height="14" alt="" />
            </button>
            <button id="explorer-btn-refresh" class="explorer-tool-btn" title="Muat Ulang">
              <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                <path d="M21.5 2v6h-6M2.5 22v-6h6M2 11.5a10 10 0 0 1 18.8-4.3M22 12.5a10 10 0 0 1-18.8 4.2"/>
              </svg>
            </button>
            <div id="explorer-breadcrumbs" class="explorer-breadcrumbs"></div>
          </div>
          <div class="explorer-actions-group">
            <div class="explorer-search-wrapper">
              <input type="text" id="explorer-search-input" class="explorer-search-input" placeholder="Filter file/folder..." autocomplete="off">
            </div>
            <button id="explorer-btn-new-file" class="explorer-action-btn" title="Buat File Baru">
              <span class="btn-plus">+</span> File
            </button>
            <button id="explorer-btn-new-folder" class="explorer-action-btn" title="Buat Folder Baru">
              <span class="btn-plus">+</span> Folder
            </button>
            <button id="explorer-btn-open-terminal" class="explorer-action-btn" title="Buka Terminal di folder ini">
              <img src="/icons/terminal.svg" width="14" height="14" alt="" />
              <span class="btn-text">Terminal</span>
            </button>
          </div>
        </div>

        <div id="explorer-content" class="explorer-content">
          <div class="explorer-table-header">
            <div class="col-name">Nama</div>
            <div class="col-type">Tipe</div>
            <div class="col-actions">Aksi</div>
          </div>
          <div id="explorer-list" class="explorer-list"></div>
        </div>

        <div class="explorer-footer">
          <span id="explorer-item-count">0 item</span>
          <span id="explorer-current-path-display">~</span>
        </div>
      </div>

      <!-- Area Code Editor Full View -->
      <div id="editor-area" class="editor-area hidden">
        <div id="editor-cm-container" class="editor-cm-container"></div>
      </div>

      <!-- Baris Tombol Ekstra -->
      <div id="extra-keys-bar" class="extra-keys-bar">
        <button class="key-btn" data-key="Esc">Esc</button>
        <button class="key-btn" data-key="Tab">Tab</button>
        <button class="key-btn" data-key="Ctrl" id="btn-ctrl">Ctrl</button>
        <button class="key-btn" data-key="Alt" id="btn-alt">Alt</button>
        <button class="key-btn" data-key="Left">←</button>
        <button class="key-btn" data-key="Up">↑</button>
        <button class="key-btn" data-key="Down">↓</button>
        <button class="key-btn" data-key="Right">→</button>
      </div>
    </div>
  </div>

  <!-- Context Menu Explorer (Titik Tiga) -->
  <div id="explorer-context-menu" class="explorer-context-menu hidden">
    <div class="context-menu-item" data-action="open-terminal">
      <img src="/icons/terminal.svg" class="context-menu-icon" width="16" height="16" alt="" />
      Open in terminal
    </div>
    <div class="context-menu-item" data-action="open-editor">
      <img src="/icons/file.svg" class="context-menu-icon" width="16" height="16" alt="" />
      Open in editor
    </div>
    <div class="context-menu-separator"></div>
    <div class="context-menu-item" data-action="rename">
      <img src="/icons/edit.svg" class="context-menu-icon" width="16" height="16" alt="" />
      Rename
    </div>
    <div class="context-menu-item" data-action="move">
      <img src="/icons/move.svg" class="context-menu-icon" width="16" height="16" alt="" />
      Move
    </div>
    <div class="context-menu-separator"></div>
    <div class="context-menu-item danger" data-action="delete">
      <img src="/icons/trash.svg" class="context-menu-icon" width="16" height="16" alt="" />
      Delete
    </div>
  </div>

  <!-- Modal Dialog Interaktif untuk Operasi File/Folder -->
  <div id="fs-modal" class="fs-modal hidden">
    <div class="fs-modal-box">
      <div id="fs-modal-title" class="fs-modal-title">Judul</div>
      <div id="fs-modal-body" class="fs-modal-body">
        <p id="fs-modal-message" class="fs-modal-message"></p>
        <input type="text" id="fs-modal-input" class="fs-modal-input" autocomplete="off" spellcheck="false" />
      </div>
      <div class="fs-modal-actions">
        <button id="fs-modal-cancel" class="fs-modal-btn cancel">Batal</button>
        <button id="fs-modal-confirm" class="fs-modal-btn confirm">Lanjutkan</button>
      </div>
    </div>
  </div>

  <script src="/vendor/xterm.js"></script>
  <script src="/vendor/addon-fit.js"></script>
  <script src="/vendor/codemirror.bundle.js"></script>
  <script src="/app.js"></script>
</body>
</html>
