<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Termux Workspace</title>
  <link rel="stylesheet" href="/vendor/xterm.css">
  <link rel="stylesheet" href="/style.css">
</head>
<body>
  <div id="layout" class="layout">
    <!-- Sidebar Explorer -->
    <aside id="sidebar" class="sidebar">
      <div class="sidebar-header">
        <span class="sidebar-title">Explorer</span>
        <button id="btn-collapse-sidebar" class="btn-icon" title="Lipat sidebar">«</button>
      </div>
      <div id="file-tree" class="file-tree"></div>
    </aside>

    <!-- Area Utama -->
    <div class="main-area">
      <!-- Bar Tab -->
      <div class="tab-bar">
        <div id="tabs-container" class="tabs-container"></div>
        <div class="tab-actions">
          <button id="btn-add-session" class="btn-add" title="New Session">+</button>
        </div>
      </div>

      <!-- Menu Popup New Session -->
      <div id="popup-menu" class="popup-menu hidden">
        <div class="popup-title">New Session</div>
        <div id="popup-items" class="popup-items">
          <div class="popup-item" data-action="terminal">Terminal</div>
          <div class="popup-item" data-action="explorer">Explorer</div>
          <div class="popup-separator"></div>
          <div class="popup-item" data-action="split">Split View</div>
        </div>
        <div class="popup-search-box">
          <input type="text" id="popup-search-input" placeholder="Search/shortcut..." autocomplete="off">
          <span class="shortcut-badge">Ctrl K</span>
        </div>
      </div>

      <!-- Area Terminal -->
      <div id="terminal-area" class="terminal-area">
        <div id="panel-left" class="terminal-panel active-panel">
          <div id="terminal-container-left" class="terminal-container"></div>
        </div>
        <div id="panel-right" class="terminal-panel hidden">
          <div id="terminal-container-right" class="terminal-container"></div>
        </div>
      </div>

      <!-- Baris Tombol Ekstra -->
      <div id="extra-keys-bar" class="extra-keys-bar">
        <button class="key-btn" data-key="Esc">Esc</button>
        <button class="key-btn" data-key="Tab">Tab</button>
        <button class="key-btn" data-key="Ctrl" id="btn-ctrl">Ctrl</button>
        <button class="key-btn" data-key="Alt" id="btn-alt">Alt</button>
        <button class="key-btn" data-key="Left">←</button>
        <button class="key-btn" data-key="Up">↑</button>
        <button class="key-btn" data-key="Down">↓</button>
        <button class="key-btn" data-key="Right">→</button>
      </div>
    </div>
  </div>

  <script src="/vendor/xterm.js"></script>
  <script src="/vendor/addon-fit.js"></script>
  <script src="/app.js"></script>
</body>
</html>
